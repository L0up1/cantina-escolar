<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cantina-Escolar</title>
    <link href= "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5" style="max-width: 800px;">

    <h1 class="mb-4">Gestão de Categorias</h1>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Nova Categoria</h5>

            <form th:action="@{/categorias}"
                  th:object="${categoria}"
                  method="post">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome da Categoria</label>
                    <input type="text" id="nome" class="form-control" th:field="*{nome}" placeholder="Ex: Salgados, Bebidas..." >
                    <div
                            class="text-danger mt-1"
                            th:if="${#fields.hasErrors('nome')}"
                            th:errors="*{nome}">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Salvar</button>
            </form>
        </div>
    </div>

    <h2>Categorias Cadastradas</h2>

    <table class="table table-striped align-middle">
        <thead>
        <tr th:each="item : ${categorias}">
            <td th:text="${item.id()}">1</td>
            <td th:text="${item.nome()}">Salgados</td>
            <td>
                <div class="d-flex gap-2">

                    <button type="button"
                            class="btn btn-warning btn-sm"
                            data-bs-toggle="modal"
                            th:data-bs-target="'#modalEditar' + ${item.id()}">
                        Editar
                    </button>

                    <form th:action="@{/categorias/{id}(id=${item.id()})}" method="post">
                        <input type="hidden" name="_method" value="DELETE"/>
                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm('Tem certeza que deseja excluir?')">
                            Excluir
                        </button>
                    </form>

                </div>

                <div class="modal fade"
                     th:id="'modalEditar' + ${item.id()}"
                     tabindex="-1"
                     aria-hidden="true">

                    <div class="modal-dialog">
                        <div class="modal-content">

                            <div class="modal-header">
                                <h5 class="modal-title">Editar Categoria</h5>

                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal">
                                </button>
                            </div>

                            <form th:action="@{/categorias/{id}(id=${item.id()})}"
                                  method="post">

                                <input type="hidden" name="_method" value="PUT"/>

                                <div class="modal-body">

                                    <div class="mb-3">
                                        <label class="form-label">Novo Nome</label>

                                        <input type="text"
                                               name="nome"
                                               class="form-control"
                                               th:value="${item.nome()}">
                                    </div>

                                </div>

                                <div class="modal-footer">
                                    <button type="button"
                                            class="btn btn-secondary"
                                            data-bs-dismiss="modal">
                                        Cancelar
                                    </button>

                                    <button type="submit"
                                            class="btn btn-primary">
                                        Salvar Alterações
                                    </button>

                                </div>

                            </form>

                        </div>
                    </div>
                </div>

            </td>
        </tr>
        </thead>
    </table>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
